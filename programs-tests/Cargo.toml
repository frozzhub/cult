# Tests for the two programs in LiteSVM (in-process Solana runtime, works on Windows without a validator).
# Separate from the programs' workspace so its newer Solana crates don't clash with Anchor 0.31's.
# Run: cargo build-sbf for both programs first, then `cargo test` in this folder.
[package]
name = "paper-programs-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
litesvm = "0.18.2"
solana-address = { version = "~2.7", features = ["curve25519", "sha2"] }
solana-instruction = "~3.5"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-system-interface = { version = "3", features = ["bincode"] }
spl-token-2022-interface = "4"
solana-program-pack = "3"
sha2 = "0.10"