  <!-- growth line -->
  <polyline points="690,396 760,360 866,320 972,290 1078,235 1184,180 1290,120 1396,50" fill="none" stroke="url(#lineFade)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1396" cy="50" r="34" fill="url(#tipGlow)"/>
  <circle cx="1396" cy="50" r="11" fill="#8ee4b8"/>

  <!-- small lockup -->
  <g transform="translate(90,70) scale(0.140625)">
    <g clip-path="url(#roundCrop)"><rect width="512" height="512" fill="#15171a"/>
  <g id="mark">
    <defs>
      <radialGradient id="cultGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8ee4b8" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#8ee4b8" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="cultFrame"><rect width="512" height="512"/></clipPath>
    </defs>
    <g clip-path="url(#cultFrame)">
      <!-- the inner circle, worn as a halo -->
      <circle cx="256" cy="222" r="176" fill="none" stroke="#e9e4d8" stroke-width="14"/>

      <!-- hooded member -->
      <path d="M256,70 C186,96 148,170 148,252 C148,306 112,372 70,530 L442,530 C400,372 364,306 364,252 C364,170 326,96 256,70 Z"
            fill="#e9e4d8" stroke="#0d0e10" stroke-width="14" stroke-linejoin="round"/>
      <!-- robe folds -->
      <g fill="none" stroke="#0d0e10" stroke-width="6" stroke-linecap="round" opacity="0.55">
        <path d="M256,372 V530"/>
        <path d="M196,390 C184,430 172,470 164,530"/>
        <path d="M316,390 C328,430 340,470 348,530"/>
      </g>

      <!-- the void under the hood -->
      <path d="M256,140 C212,158 192,212 192,262 C192,318 224,356 256,356 C288,356 320,318 320,262 C320,212 300,158 256,140 Z" fill="#0d0e10"/>

      <!-- the mint dot: what the cult is paid in -->
      <circle cx="256" cy="262" r="58" fill="url(#cultGlow)"/>
      <circle cx="256" cy="262" r="22" fill="#8ee4b8"/>
    </g>
  </g>
    </g>
  </g>
  <g transform="translate(-6,61.7) scale(0.3)" fill="none" stroke="#e9e4d8" stroke-width="34">
    <path d="M736,175 A58,58 0 1 0 736,257"/>
    <path d="M801,141 V214 A60,60 0 0 0 921,214 V141"/>
    <path d="M995,141 V274 H1091"/>
    <path d="M1109,158 H1253 M1181,158 V291"/>
  </g>

  <!-- headline -->
  <g font-family="'Inter Tight','Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="88">
    <text x="88" y="268" fill="#e9e4d8">The cult</text>
    <text x="88" y="364" fill="#8ee4b8">only grows.</text>
  </g>
  <text x="90" y="424" font-family="'Inter Tight','Inter','Segoe UI',Arial,sans-serif" font-weight="600" font-size="24" fill="#9a978f">Everyone's panicking. The cult is getting paid.</text>
</svg>