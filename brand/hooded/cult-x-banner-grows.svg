<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <clipPath id="roundCrop"><circle cx="256" cy="256" r="256"/></clipPath>
    <linearGradient id="lineFade" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1420" y2="0">
      <stop offset="0" stop-color="#2775CA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2775CA"/>
    </linearGradient>
    <linearGradient id="areaFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2775CA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2775CA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tipGlow"><stop offset="0" stop-color="#2775CA" stop-opacity="0.6"/><stop offset="1" stop-color="#2775CA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#0d0e10"/>

  <!-- chart -->
  <polyline points="700,410 780,372 850,388 940,318 1020,336 1110,250 1190,268 1290,160 1350,180 1420,72" fill="none" stroke="url(#lineFade)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1420" cy="72" r="36" fill="url(#tipGlow)"/>
  <circle cx="1420" cy="72" r="11" fill="#2775CA"/>


  <!-- catch phrase -->
  <g font-family="'Inter Tight','Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="88">
    <text x="88" y="140" fill="#e9e4d8">the cult</text>
    <text x="88" y="236" fill="#2775CA">only grows.</text>
  </g>
</svg>