<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet"><style>
:root{--bg:#0d0e10;--surface:#15171a;--line:#24272c;--text:#eceae4;--muted:#868b94;--dim:#5d626b;--blue:#2775ca;--ink:#4b8fd8;--red:#e5484d}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:1200px;background:var(--bg);color:var(--text);font-family:"Inter Tight",sans-serif;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(600px 520px at 50% 46%,rgba(39,117,202,.10),transparent 70%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px}
.foot{position:absolute;left:0;right:0;bottom:64px;display:flex;align-items:center;justify-content:center;gap:14px;font:700 26px "Inter Tight";letter-spacing:.14em}
.foot .mark{width:38px;height:38px}.foot span{color:var(--muted);font:500 22px "JetBrains Mono";letter-spacing:0;margin-left:6px}
h1{margin:0;font:700 96px/1.02 "Inter Tight";letter-spacing:-.04em}
h2{margin:0;font:700 64px/1.05 "Inter Tight";letter-spacing:-.035em}
em{font-style:normal;color:var(--blue)}
.mono{font-family:"JetBrains Mono",monospace}
.muted{color:var(--muted)}
.usdc{width:1em;height:1em;vertical-align:-.14em}
.sol{width:1.1em;height:.86em;vertical-align:-.08em}
.steps{list-style:none;margin:60px 0 0;padding:0;text-align:left;font:600 58px/1.15 "Inter Tight";letter-spacing:-.03em}
.steps li{display:flex;align-items:center;gap:34px;padding:22px 0}.steps li+li{border-top:1px solid var(--line)}
.steps .n{font:500 30px "JetBrains Mono";color:var(--dim);width:52px}</style></head><body><div class="glow"></div><div class="wrap" style="padding-bottom:160px"><div class="mono muted" style="font-size:28px;letter-spacing:.18em">THE RITUAL</div><ol class="steps">
<li><span class="n">01</span>Join with <svg class="sol" viewBox="0 0 397.7 311.7" aria-label="Solana"><defs><linearGradient id="sg" x1="360.9" y1="351.5" x2="141.2" y2="-69.3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00ffa3"/><stop offset="1" stop-color="#dc1fff"/></linearGradient></defs><path fill="url(#sg)" d="M64.6 237.9c2.4-2.4 5.7-3.8 9.2-3.8h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1l62.7-62.7zM64.6 3.8C67.1 1.4 70.4 0 73.8 0h317.4c5.8 0 8.7 7 4.6 11.1l-62.7 62.7c-2.4 2.4-5.7 3.8-9.2 3.8H6.5c-5.8 0-8.7-7-4.6-11.1L64.6 3.8zM333.1 120.1c-2.4-2.4-5.7-3.8-9.2-3.8H6.5c-5.8 0-8.7 7-4.6 11.1l62.7 62.7c2.4 2.4 5.7 3.8 9.2 3.8h317.4c5.8 0 8.7-7 4.6-11.1l-62.7-62.7z"/></svg> <span class="muted" style="font-weight:500">(0% fee)</span></li>
<li><span class="n">02</span>Hold.</li>
<li><span class="n">03</span>Receive <img class="usdc" src="../../public/usdc.svg" alt="USDC"> <em>every 10 min</em></li>
<li><span class="n">04</span>Repeat. Forever.</li></ol></div><div class="foot"><img class="mark" src="../hooded/cult-transparent.svg" alt="">CULT<span>cults.bid</span></div></body></html>
