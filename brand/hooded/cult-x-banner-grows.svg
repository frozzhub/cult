      <circle cx="760" cy="458" r="7" fill="#8ee4b8"/>
    </g>
    <g opacity="0.42">
      <path d="M866,350 C836,362 821,395 821,435 L821,520 L911,520 L911,435 C911,395 896,362 866,350 Z" fill="#e9e4d8"/>
