<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0d0e10;overflow:hidden}
body{position:relative;font-family:"Inter Tight",sans-serif;color:#eceae4}
.glow{position:absolute;left:50%;top:46%;width:900px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(142,228,184,.10),transparent)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mark{display:flex;align-items:center;gap:14px;font:700 34px "Inter Tight";letter-spacing:-.01em}
.mark i{width:18px;height:18px;border-radius:50%;background:#8ee4b8;display:inline-block}
h1{margin:40px 0 0;font:600 76px/1.05 "Inter Tight";letter-spacing:-.03em;max-width:1000px}
h1 em{font-style:normal;color:#8ee4b8}
.clock{margin-top:34px;font:500 30px "JetBrains Mono";color:#868b94;letter-spacing:.02em}
.dom{position:absolute;left:44px;bottom:34px;font:500 18px "JetBrains Mono";color:#5d626b}
</style></head><body><div class="glow"></div>
<div class="wrap"><div class="mark"><i></i>$PAPER</div><h1>Paper hands pay <em>diamond hands.</em></h1><div class="clock">0% buy · 15% sell · USDC to holders every 10 min</div></div>
</body></html>
