      <circle cx="972" cy="388" r="7" fill="#8ee4b8"/>
    </g>
    <g opacity="0.65">
      <path d="M1078,265 C1048,277 1033,310 1033,350 L1033,520 L1123,520 L1123,350 C1123,310 1108,277 1078,265 Z" fill="#e9e4d8"/>
