      <stop offset="0" stop-color="#8ee4b8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8ee4b8"/>
    </linearGradient>
    <radialGradient id="tipGlow"><stop offset="0" stop-color="#8ee4b8" stop-opacity="0.6"/><stop offset="1" stop-color="#8ee4b8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#0d0e10"/>

  <!-- chart grid -->
  <g stroke="#1a1c20" stroke-width="2">
    <line x1="690" y1="100" x2="1500" y2="100"/><line x1="690" y1="200" x2="1500" y2="200"/>
    <line x1="690" y1="300" x2="1500" y2="300"/><line x1="690" y1="400" x2="1500" y2="400"/>
  </g>

  <!-- the bars are members: each round the cult stands taller -->
    <g opacity="0.3">
