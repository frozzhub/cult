    <g opacity="0.88">
      <path d="M1290,150 C1260,162 1245,195 1245,235 L1245,520 L1335,520 L1335,235 C1335,195 1320,162 1290,150 Z" fill="#e9e4d8"/>
      <path d="M1290,180 C1273,188 1266,206 1266,220 C1266,240 1279,250 1290,250 C1301,250 1314,240 1314,220 C1314,206 1307,188 1290,180 Z" fill="#0d0e10"/>
