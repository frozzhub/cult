      <circle cx="1078" cy="333" r="7" fill="#8ee4b8"/>
    </g>
    <g opacity="0.77">
      <path d="M1184,210 C1154,222 1139,255 1139,295 L1139,520 L1229,520 L1229,295 C1229,255 1214,222 1184,210 Z" fill="#e9e4d8"/>
      <path d="M1184,240 C1167,248 1160,266 1160,280 C1160,300 1173,310 1184,310 C1195,310 1208,300 1208,280 C1208,266 1201,248 1184,240 Z" fill="#0d0e10"/>
      <circle cx="1184" cy="278" r="7" fill="#8ee4b8"/>
